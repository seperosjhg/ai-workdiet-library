<style>

  /* 무대 */
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  .slide{
    display:none; width:min(1100px,94vw); height:min(680px,92vh);
    background:var(--paper); border-radius:22px; padding:60px 70px;
    box-shadow:0 30px 80px rgba(0,0,0,.45); position:relative;
    flex-direction:column; justify-content:center; overflow:hidden;

  @keyframes fade{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:none;}}

  .slide.cover,.slide.section{background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff;}
  .slide.cover h1,.slide.section h1{color:#fff;}
  .tag{display:inline-block; font-size:15px; letter-spacing:2px; color:var(--sky);
    font-weight:700; margin-bottom:18px;}
  .slide.cover .tag,.slide.section .tag{color:var(--gold);}
  h1{font-size:46px; line-height:1.25; font-weight:800; color:var(--navy); margin-bottom:18px;}
  h2{font-size:32px; font-weight:800; color:var(--navy); margin-bottom:24px; line-height:1.3;}

  .big{font-size:40px; font-weight:800; line-height:1.4;}
  .muted{color:var(--muted);}
  ul.points{list-style:none; margin-top:10px;}
  ul.points li{font-size:23px; line-height:1.5; padding:13px 0 13px 44px; position:relative;}

    color:var(--blue); font-weight:800; font-size:26px;}
  .quote{font-size:34px; font-weight:800; line-height:1.5; color:var(--navy);
    border-left:8px solid var(--gold); padding-left:26px;}
  .slide.cover .quote,.slide.section .quote{color:#fff; border-color:var(--gold);}
  .row{display:flex; gap:26px; margin-top:18px;}
  .card{flex:1; background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:24px 22px; box-shadow:0 6px 18px rgba(20,40,80,.06);}
  .card .h{font-size:20px; font-weight:800; color:var(--blue); margin-bottom:10px;}
  .card p{font-size:18px; line-height:1.5; color:var(--ink);}
  .badge{display:inline-block; background:var(--blue); color:#fff; font-size:15px;
    font-weight:700; padding:5px 14px; border-radius:999px; margin-bottom:14px;}
  .ba{display:flex; gap:20px; margin-top:14px;}
  .ba .b,.ba .a{flex:1; border-radius:16px; padding:24px;}
  .ba .b{background:#fbe9e9; border:1px solid #e9b8b8;}
  .ba .a{background:#e7f6ec; border:1px solid #aedcc0;}
  .ba .t{font-size:18px; font-weight:800; margin-bottom:10px;}
  .ba .b .t{color:#c0392b;} .ba .a .t{color:#1e8449;}
  .ba p{font-size:18px; line-height:1.5;}
  .step{display:flex; gap:18px; align-items:flex-start; margin:16px 0;}
  .step .n{flex:none; width:46px; height:46px; border-radius:50%;
    background:var(--blue); color:#fff; font-weight:800; font-size:22px;
    display:flex; align-items:center; justify-content:center;}
  .step .tx{font-size:22px; line-height:1.5; padding-top:6px;}
  .files{font-size:15px; color:var(--muted); margin-top:18px; font-style:italic;}
  .files b{color:var(--blue); font-style:normal;}
  /* 하단 바 */
  #bar{position:fixed; left:0; right:0; bottom:0; height:8px; background:rgba(255,255,255,.12);}
  #fill{height:100%; background:var(--gold); width:0; transition:width .3s;}
  #pageno{position:fixed; right:20px; bottom:18px; color:#9fb4d6; font-size:14px; font-weight:700;}
  #hint{position:fixed; left:20px; bottom:16px; color:#7c93bb; font-size:13px;}
  /* 발표자 노트 */
  #notes{position:fixed; left:0; right:0; bottom:0; background:#10182b; color:#dfe7f5;
    border-top:3px solid var(--gold); padding:18px 28px; max-height:42vh; overflow:auto;
    display:none; font-size:16px; line-height:1.6;}
  #notes.show{display:block;}
  #notes h4{color:var(--gold); font-size:14px; letter-spacing:1px; margin-bottom:6px;}
  #notes .nt{white-space:pre-wrap;}
  .timechip{display:inline-block; background:#27406e; color:#cfe0ff; font-size:13px;
    font-weight:700; padding:3px 10px; border-radius:6px; margin-left:8px;}
</style>
</head>

/* ===== 렌더링/네비게이션 ===== */
let cur = 0;
const stage = document.getElementById('stage');
const notesBox = document.getElementById('notes');
slides.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'slide '+(s.cls||'');
  d.dataset.idx = i;
  d.innerHTML = s.html;
  stage.appendChild(d);
});
const nodes = [...document.querySelectorAll('.slide')];
function show(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  nodes.forEach((n,k)=>n.classList.toggle('active', k===cur));
  document.getElementById('fill').style.width = ((cur+1)/slides.length*100)+'%';
  document.getElementById('pageno').textContent = (cur+1)+' / '+slides.length;
  notesBox.querySelector('.nt').textContent = slides[cur].note || '(노트 없음)';
}
function toggleNotes(){ notesBox.classList.toggle('show'); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') {show(cur+1); e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp') show(cur-1);
  else if(e.key==='Home') show(0);
  else if(e.key==='End') show(slides.length-1);
  else if(e.key.toLowerCase()==='s') toggleNotes();
  else if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
/* 클릭/터치로도 넘김 — 단, 영상 등 조작 요소 클릭은 제외 */
stage.addEventListener('click',e=>{
  if(e.target.closest('video, a, button, input')) return; // 영상 컨트롤 보호
  if(e.clientX < window.innerWidth/2) show(cur-1); else show(cur+1);
});
show(0);
</script>
